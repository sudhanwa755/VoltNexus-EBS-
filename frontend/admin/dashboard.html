<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        if (localStorage.getItem('ebs_theme') === 'dark' || (!('ebs_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VoltNexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        'violet': {
                            400: '#A78BFA',
                            500: '#8B5CF6',
                            600: '#7C3AED',
                        },
                        'purple': {
                            600: '#9333EA',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">
    <!-- Mobile Header -->
    <div
        class="lg:hidden fixed w-full z-50 glass-card border-b border-slate-200 dark:border-slate-800 px-4 h-24 flex items-center justify-between transition-all duration-300">
        <div class="flex items-center gap-2">
            <img src="../assets/day.png" alt="VoltNexus" class="h-16 w-auto dark:hidden">
            <img src="../assets/night.png" alt="VoltNexus" class="h-16 w-auto hidden dark:block">
            <span
                class="text-xs bg-violet-100 dark:bg-violet-900/30 text-violet-600 dark:text-violet-400 px-2 py-0.5 rounded-full ml-1">Admin</span>
        </div>
        <button id="mobileMenuBtn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
    </div>

    <div class="flex min-h-screen pt-28 lg:pt-0">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-60 w-64 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 glass-card border-r border-slate-200 dark:border-slate-800 flex flex-col">
            <div
                class="h-24 md:h-32 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800 transition-all duration-300">
                <div class="flex flex-col items-center gap-1">
                    <img src="../assets/day.png" alt="VoltNexus"
                        class="h-16 md:h-20 lg:h-24 w-auto object-contain flex-shrink-0 dark:hidden">
                    <img src="../assets/night.png" alt="VoltNexus"
                        class="h-16 md:h-20 lg:h-24 w-auto object-contain flex-shrink-0 hidden dark:block">
                    <span
                        class="text-[10px] uppercase tracking-wider font-bold bg-violet-100 dark:bg-violet-900/30 text-violet-600 dark:text-violet-400 px-2 py-0.5 rounded-full ml-1">Admin
                        Panel</span>
                </div>
                <button id="sidebarCloseBtn"
                    class="lg:hidden p-1 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl bg-violet-50 dark:bg-violet-900/20 text-violet-600 dark:text-violet-400 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                        </path>
                    </svg>
                    Dashboard
                </a>
                <a href="manage-users.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    Manage Users
                </a>
                <a href="bills.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    Manage Bills
                </a>
                <a href="tariffs.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                    Tariffs
                </a>
                <a href="add-reading.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                    Add Reading
                </a>
                <a href="reports.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    Reports
                </a>
                <a href="../profile.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    Profile
                </a>
            </nav>

            <div class="p-4 border-t border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-3 px-4 py-3 mb-2">
                    <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-slate-600 dark:text-slate-300"
                        id="userInitials">A</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="userName">Admin User</p>
                        <p class="text-xs text-slate-500 truncate" id="userEmail">admin@example.com</p>
                    </div>
                </div>
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 transition-colors text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 p-4 sm:p-6 lg:p-8">
            <header class="responsive-header mb-8">
                <div class="order-1">
                    <h1
                        class="text-3xl font-bold bg-gradient-to-r from-blue-600 via-purple-600 to-violet-600 bg-clip-text text-transparent mb-2">
                        Admin Dashboard</h1>
                    <p class="text-slate-500 dark:text-slate-400">System overview and statistics</p>
                </div>

                <div
                    class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 order-3 sm:order-2 w-full sm:w-auto mt-4 sm:mt-0">
                    <div
                        class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700">
                        <label class="text-sm text-slate-500">From</label>
                        <input id="filterDateFrom" type="date"
                            class="text-sm bg-transparent outline-none dark:text-white">
                        <label class="text-sm text-slate-500">To</label>
                        <input id="filterDateTo" type="date"
                            class="text-sm bg-transparent outline-none dark:text-white">
                        <button id="applyFilterBtn"
                            class="px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-sm hover:bg-slate-100 dark:hover:bg-slate-700">Apply</button>
                        <button id="exportCsvBtn"
                            class="px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-sm hover:bg-slate-100 dark:hover:bg-slate-700">Export
                            CSV</button>
                    </div>
                </div>
                <!-- Theme Toggle (Extreme Right) -->
                <button id="themeToggle"
                    class="order-2 sm:order-3 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 btn-touch">
                    <svg class="w-5 h-5 text-amber-500 dark:hidden" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <svg class="w-5 h-5 hidden dark:block text-slate-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                        </path>
                    </svg>
                </button>
            </header>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Total Users Card -->
                <div
                    class="group relative glass-card-premium p-6 rounded-2xl overflow-hidden hover:scale-[1.02] transition-all duration-300">
                    <!-- Gradient Background Overlay -->
                    <div
                        class="absolute inset-0 gradient-violet opacity-5 group-hover:opacity-10 transition-opacity duration-300">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-slate-600 dark:text-slate-400 font-semibold">Total Users</h3>
                            <!-- Icon with gradient background -->
                            <div
                                class="p-3 gradient-violet rounded-xl shadow-lg glow-violet group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold mb-2 bg-gradient-to-r from-violet-600 to-purple-600 bg-clip-text text-transparent"
                            id="totalUsers">0</div>
                        <div class="text-sm text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                            </svg>
                            <span>+2 this week</span>
                        </div>
                    </div>
                </div>

                <!-- Total Revenue Card -->
                <div
                    class="group relative glass-card-premium p-6 rounded-2xl overflow-hidden hover:scale-[1.02] transition-all duration-300">
                    <!-- Gradient Background Overlay -->
                    <div
                        class="absolute inset-0 gradient-emerald opacity-5 group-hover:opacity-10 transition-opacity duration-300">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-slate-600 dark:text-slate-400 font-semibold">Total Revenue</h3>
                            <!-- Icon with gradient background -->
                            <div
                                class="p-3 gradient-emerald rounded-xl shadow-lg glow-emerald group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold mb-2 bg-gradient-to-r from-emerald-600 to-lime-600 bg-clip-text text-transparent"
                            id="totalRevenue">₹0.00</div>
                        <div class="text-sm text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                            </svg>
                            <span>+12% vs last month</span>
                        </div>
                    </div>
                </div>

                <!-- Overdue Bills Card -->
                <div
                    class="group relative glass-card-premium p-6 rounded-2xl overflow-hidden hover:scale-[1.02] transition-all duration-300">
                    <!-- Gradient Background Overlay -->
                    <div
                        class="absolute inset-0 bg-gradient-to-br from-red-500/10 to-orange-500/10 opacity-5 group-hover:opacity-10 transition-opacity duration-300">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-slate-600 dark:text-slate-400 font-semibold">Overdue Bills</h3>
                            <!-- Icon with gradient background -->
                            <div class="p-3 bg-gradient-to-br from-red-500 to-orange-600 rounded-xl shadow-lg group-hover:scale-110 transition-transform duration-300"
                                style="box-shadow: 0 0 20px rgba(239, 68, 68, 0.3), 0 0 40px rgba(239, 68, 68, 0.2);">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold mb-2 bg-gradient-to-r from-red-600 to-orange-600 bg-clip-text text-transparent"
                            id="overdueCount">0</div>
                        <div class="text-sm text-red-600 dark:text-red-400">Action required</div>
                    </div>
                </div>
            </div>

            <!-- Revenue Chart -->
            <div class="glass-card p-6 rounded-2xl mb-8">
                <h3 class="text-lg font-bold mb-6">Revenue Overview</h3>
                <div class="relative h-80 w-full">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation (Admin Pages - 6 items) -->


    <!-- Overlay for mobile sidebar -->
    <!-- Overlay for mobile sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-55 hidden lg:hidden glass-card backdrop-blur-sm"></div>

    <script type="module" src="../assets/js/admin.js"></script>
    <script type="module" src="../assets/js/admin-analytics.js"></script>
</body>

</html>
