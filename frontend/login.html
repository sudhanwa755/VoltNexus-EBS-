<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        if (localStorage.getItem('ebs_theme') === 'dark' || (!('ebs_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VoltNexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        'violet': {
                            400: '#A78BFA',
                            500: '#8B5CF6',
                            600: '#7C3AED',
                        },
                        'purple': {
                            600: '#9333EA',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body
    class="bg-gradient-to-br from-violet-50 via-slate-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-violet-950 text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4 transition-colors duration-300 relative overflow-hidden">

    <!-- Animated Background Gradient Orbs -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-violet-500/20 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-500/20 rounded-full blur-3xl animate-pulse"
            style="animation-delay: 1s;"></div>
    </div>

    <!-- Theme Toggle Button -->
    <button id="themeToggle"
        class="fixed top-4 right-4 p-3 rounded-full glass-card hover:scale-110 transition-all duration-300 z-50 glow-violet-hover">
        <svg class="w-6 h-6 text-amber-500 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
            </path>
        </svg>
        <svg class="w-6 h-6 hidden dark:block text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
            </path>
        </svg>
    </button>

    <div class="glass-card-premium w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <img src="assets/day.png" alt="VoltNexus"
                    class="h-16 md:h-24 w-auto dark:hidden transition-all duration-300">
                <img src="assets/night.png" alt="VoltNexus"
                    class="h-16 md:h-24 w-auto hidden dark:block transition-all duration-300">
            </div>
            <h1
                class="text-2xl font-bold bg-gradient-to-r from-blue-600 via-purple-600 to-violet-600 bg-clip-text text-transparent mb-2">
                Welcome Back</h1>
            <p class="text-slate-600 dark:text-slate-400">Sign in to manage your electricity account</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                    placeholder="name@example.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all pr-12"
                        placeholder="••••••••">
                    <button type="button" id="togglePassword"
                        class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 .847 0 1.67.124 2.454.36l-1.83 1.83A3.004 3.004 0 0012 15a3 3 0 10-3-3l-1.83-1.83A9.953 9.953 0 002.458 12c1.274 4.057 5.064 7 9.542 7a9.953 9.953 0 004.32-.825l-1.47-1.47A4.98 4.98 0 0113.875 18.825zM16.5 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <span>Remember me</span>
                </label>
                <a href="#"
                    class="text-violet-600 dark:text-violet-400 hover:text-violet-700 dark:hover:text-violet-300 font-medium transition-colors">Forgot
                    password?</a>
            </div>

            <button type="submit" id="loginBtn"
                class="group relative w-full py-4 px-6 rounded-xl gradient-violet hover:shadow-2xl text-white font-semibold shadow-lg glow-violet-hover hover:scale-[1.02] transition-all duration-300 overflow-hidden flex justify-center items-center gap-2">

                <!-- Shimmer effect -->
                <div
                    class="absolute inset-0 -translate-x-full group-hover:translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent transition-transform duration-700">
                </div>

                <span class="relative z-10">Sign In</span>
                <svg class="relative z-10 w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6">
                    </path>
                </svg>
                <div class="loader hidden border-white border-t-transparent w-5 h-5 relative z-10"></div>
            </button>
        </form>

        <div id="errorMessage"
            class="mt-4 p-3 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm text-center hidden">
            Invalid credentials. Please try again.
        </div>

        <div class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
            Don't have an account?
            <a href="register.html"
                class="text-violet-600 dark:text-violet-400 hover:text-violet-700 dark:hover:text-violet-300 font-semibold transition-colors">Create
                account</a>
        </div>
    </div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // Initialize theme from localStorage or system preference
        const initTheme = () => {
            const savedTheme = localStorage.getItem('ebs_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
            }
        };

        // Toggle theme
        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('ebs_theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('ebs_theme', 'dark');
            }
        });

        // Initialize on page load
        initTheme();

        // Password Toggle Functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        togglePassword.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        });
    </script>

    <script type="module">
        import { Auth } from './assets/js/auth.js';

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loader = loginBtn.querySelector('.loader');
        const btnText = loginBtn.querySelector('span');

        window.fillCreds = (email, pass) => {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        };

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // UI Loading State
            loginBtn.disabled = true;
            loader.classList.remove('hidden');
            btnText.classList.add('hidden');
            errorMessage.classList.add('hidden');

            try {
                const user = await Auth.login(email, password);
                console.log('✅ Login successful! User object:', user);
                console.log('📧 Email:', user.email);
                console.log('👤 Name:', user.name);
                console.log('🔑 Role:', user.role);
                console.log('🔍 Role type:', typeof user.role);

                // Use the authoritative session user (stored by Auth.login) to decide redirect
                const sessionUser = Auth.getUser();
                console.log('📦 Session user after login:', sessionUser);
                const finalRole = (sessionUser?.role || user.role || 'USER').toString().trim().toUpperCase();
                console.log('🔁 Final normalized role used for redirect:', finalRole);

                if (finalRole === 'ADMIN') {
                    console.log('🚀 Redirecting to ADMIN dashboard at: admin/dashboard.html');
                    window.location.href = 'admin/dashboard.html';
                } else {
                    console.log('🚀 Redirecting to USER dashboard at: dashboard.html');
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                errorMessage.textContent = error.message || 'Login failed';
                errorMessage.classList.remove('hidden');
                loginBtn.disabled = false;
                loader.classList.add('hidden');
                btnText.classList.remove('hidden');
            }
        });
    </script>
    <script>
        // DEV DEBUG PANEL - only enabled for localhost or file protocol
        (function () {
            try {
                const host = window.location.hostname || '';
                if (host.includes('localhost') || host.includes('127.') || window.location.protocol === 'file:') {
                    const panel = document.createElement('div');
                    panel.id = 'debugAuthPanel';
                    panel.style.position = 'fixed';
                    panel.style.right = '12px';
                    panel.style.bottom = '12px';
                    panel.style.zIndex = 99999;
                    panel.style.background = 'rgba(0,0,0,0.7)';
                    panel.style.color = 'white';
                    panel.style.padding = '8px 12px';
                    panel.style.borderRadius = '8px';
                    panel.style.fontSize = '12px';
                    panel.style.maxWidth = '320px';
                    panel.style.boxShadow = '0 6px 24px rgba(0,0,0,0.4)';
                    panel.innerText = 'Auth debug: initializing...';
                    document.body.appendChild(panel);

                    const updatePanel = () => {
                        try {
                            const userStr = sessionStorage.getItem('ebs_user');
                            const token = sessionStorage.getItem('ebs_token');
                            const parsed = userStr ? JSON.parse(userStr) : null;
                            panel.innerText = `sessionUser: ${userStr ? JSON.stringify(parsed, null, 0) : 'null'}\ntoken: ${token ? token.substring(0, 12) + '...' : 'null'}`;
                        } catch (e) {
                            panel.innerText = 'Auth debug: cannot read session storage';
                        }
                    };

                    setInterval(updatePanel, 1000);
                }
            } catch (e) {
                // ignore
            }
        })();
    </script>
    <script>
        // Existing script is sufficient
    </script>
</body>

</html>
